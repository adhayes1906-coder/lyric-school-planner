<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#163b72">
  <title>Lyric's School Planner</title>
  <style>
    :root {
      --navy:#163b72; --navy-2:#0d2b58; --red:#a62126; --blue:#2f6fed;
      --ink:#172033; --muted:#667085; --line:#dce3ee; --soft:#f2f6fb;
      --card:#fff; --bg:#edf3f9; --success:#16865c; --warn:#b76b00; --danger:#c23434;
      --shadow:0 10px 30px rgba(22,59,114,.09); --radius:18px; --text-size:16px;
    }
    * { box-sizing:border-box; }
    html { font-size:var(--text-size); }
    body { margin:0; min-height:100vh; color:var(--ink); background:var(--bg); font-family:Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
    button, input, select, textarea { font:inherit; }
    button { cursor:pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline:3px solid rgba(47,111,237,.35); outline-offset:2px; }
    a { color:var(--blue); }
    .app { min-height:100vh; }
    .topbar { position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:16px; min-height:78px; padding:13px clamp(16px,4vw,44px); color:#fff; background:linear-gradient(120deg,var(--navy-2),var(--navy) 58%,#24569c); box-shadow:0 6px 20px rgba(13,43,88,.2); }
    .brand-mark { display:grid; place-items:center; width:48px; height:48px; flex:none; border-radius:15px; font-size:25px; background:#fff; color:var(--navy); box-shadow:inset 0 -4px 0 rgba(166,33,38,.16); }
    .brand { min-width:0; }
    .brand h1 { margin:0; font-size:clamp(1.1rem,2.4vw,1.45rem); line-height:1.15; }
    .brand p { margin:4px 0 0; font-size:.82rem; color:#dce9fb; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .top-actions { margin-left:auto; display:flex; gap:8px; }
    .icon-btn { min-height:42px; padding:9px 12px; border:1px solid rgba(255,255,255,.28); border-radius:12px; background:rgba(255,255,255,.1); color:#fff; }
    .layout { display:grid; grid-template-columns:210px minmax(0,1fr); max-width:1600px; margin:0 auto; }
    .nav { position:sticky; top:78px; align-self:start; height:calc(100vh - 78px); padding:22px 14px; border-right:1px solid var(--line); background:rgba(255,255,255,.72); backdrop-filter:blur(14px); }
    .nav button { display:flex; align-items:center; gap:10px; width:100%; padding:12px 13px; margin:3px 0; border:0; border-radius:12px; text-align:left; color:#3b4960; background:transparent; font-weight:700; }
    .nav button:hover { background:#eaf1fb; }
    .nav button.active { color:var(--navy); background:#dce9fb; }
    .nav .nav-icon { width:22px; text-align:center; }
    .school-chip { margin-top:18px; padding:13px; border:1px solid var(--line); border-radius:14px; background:var(--card); font-size:.76rem; color:var(--muted); line-height:1.45; }
    .school-chip strong { display:block; margin-bottom:4px; color:var(--ink); }
    main { width:100%; min-width:0; padding:clamp(18px,3vw,34px); }
    .page { display:none; animation:fade .18s ease; }
    .page.active { display:block; }
    @keyframes fade { from { opacity:.35; transform:translateY(4px); } }
    .page-head { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:22px; }
    .page-head h2 { margin:0; font-size:clamp(1.45rem,3vw,2rem); letter-spacing:-.03em; }
    .page-head p { margin:6px 0 0; color:var(--muted); }
    .grid { display:grid; gap:16px; }
    .grid.two { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .grid.three { grid-template-columns:repeat(3,minmax(0,1fr)); }
    .dashboard { grid-template-columns:minmax(0,1.3fr) minmax(280px,.7fr); }
    .stack { display:grid; gap:16px; align-content:start; }
    .card { border:1px solid rgba(206,217,232,.9); border-radius:var(--radius); background:var(--card); box-shadow:var(--shadow); }
    .card-pad { padding:18px; }
    .card h3 { margin:0; font-size:1rem; }
    .card-title { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; }
    .card-title p { margin:3px 0 0; color:var(--muted); font-size:.8rem; }
    .hero { overflow:hidden; padding:22px; color:#fff; background:linear-gradient(130deg,var(--navy-2),var(--navy) 58%,#2e69bb); }
    .hero-grid { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:18px; align-items:center; }
    .eyebrow { margin:0 0 8px; color:#d6e6fb; font-size:.78rem; font-weight:800; letter-spacing:.1em; text-transform:uppercase; }
    .hero h2 { margin:0; font-size:clamp(1.45rem,3vw,2.25rem); }
    .hero p { margin:9px 0 0; max-width:620px; color:#dce9fb; }
    .date-badge { min-width:112px; padding:15px; border:1px solid rgba(255,255,255,.24); border-radius:18px; text-align:center; background:rgba(255,255,255,.1); }
    .date-badge .big { display:block; font-size:2rem; font-weight:900; }
    .date-badge .small { font-size:.76rem; color:#e5effd; text-transform:uppercase; }
    .quick-add { display:grid; grid-template-columns:minmax(160px,1.6fr) minmax(145px,.8fr) 145px 92px auto; gap:9px; }
    input, select, textarea { width:100%; min-height:42px; border:1px solid #cbd5e2; border-radius:11px; padding:9px 11px; color:var(--ink); background:#fff; }
    textarea { min-height:92px; resize:vertical; }
    label { display:grid; gap:6px; color:#475467; font-size:.78rem; font-weight:800; }
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:7px; min-height:42px; padding:9px 14px; border:0; border-radius:11px; font-weight:800; background:var(--navy); color:#fff; }
    .btn:hover { filter:brightness(1.08); }
    .btn.secondary { border:1px solid #cdd8e6; background:#fff; color:var(--navy); }
    .btn.soft { background:#e7effa; color:var(--navy); }
    .btn.danger { background:#feecec; color:#a32626; }
    .btn.small { min-height:34px; padding:6px 10px; font-size:.76rem; }
    .btn.wide { width:100%; }
    .pill { display:inline-flex; align-items:center; gap:5px; padding:5px 9px; border-radius:999px; background:#edf2f7; color:#4b596f; font-size:.69rem; font-weight:850; }
    .pill.red { background:#ffeded; color:#ad2929; }
    .pill.gold { background:#fff1d7; color:#925600; }
    .pill.green { background:#e5f7ef; color:#0e744d; }
    .pill.blue { background:#e7efff; color:#2458b5; }
    .empty { padding:20px; border:1px dashed #c8d3e2; border-radius:14px; text-align:center; color:var(--muted); background:#f9fbfd; }
    .empty strong { display:block; margin-bottom:4px; color:var(--ink); }
    .priority-list, .compact-list { display:grid; gap:9px; }
    .priority-item { position:relative; display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:11px; align-items:center; padding:12px; border:1px solid var(--line); border-left:5px solid var(--class-color,var(--blue)); border-radius:13px; background:#fff; }
    .priority-number { display:grid; place-items:center; width:29px; height:29px; border-radius:9px; color:#fff; background:var(--navy); font-weight:900; }
    .item-main { min-width:0; }
    .item-main strong { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .item-main small { display:block; margin-top:3px; color:var(--muted); }
    .check { width:21px; height:21px; accent-color:var(--success); }
    .schedule-list { display:grid; gap:7px; }
    .schedule-row { display:grid; grid-template-columns:86px 9px minmax(0,1fr) auto; gap:10px; align-items:center; padding:9px 10px; border-radius:12px; background:#f7f9fc; }
    .schedule-row.current { background:#e8f1ff; box-shadow:inset 0 0 0 2px #8eb6f5; }
    .schedule-row .time { font-size:.73rem; color:#52627a; font-weight:800; }
    .schedule-row .dot { width:9px; height:34px; border-radius:9px; background:var(--class-color,var(--blue)); }
    .schedule-row strong { display:block; font-size:.86rem; }
    .schedule-row small { color:var(--muted); }
    .workload { display:grid; gap:10px; }
    .meter-track, .progress-track { height:10px; overflow:hidden; border-radius:999px; background:#e7edf5; }
    .meter-fill, .progress-fill { height:100%; border-radius:inherit; background:linear-gradient(90deg,#1d9a67,#e4a11b,#d64242); transition:width .3s ease; }
    .progress-fill { background:var(--blue); }
    .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
    .stat { padding:12px 8px; border-radius:13px; text-align:center; background:#f4f7fb; }
    .stat strong { display:block; font-size:1.35rem; }
    .stat span { font-size:.68rem; color:var(--muted); }
    .segmented { display:flex; flex-wrap:wrap; padding:4px; border-radius:12px; background:#e9eef5; }
    .segmented button { min-height:34px; padding:6px 11px; border:0; border-radius:9px; color:#506078; background:transparent; font-size:.78rem; font-weight:800; }
    .segmented button.active { color:var(--navy); background:#fff; box-shadow:0 2px 7px rgba(20,40,70,.11); }
    .calendar-toolbar { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:14px; }
    .calendar-toolbar h3 { min-width:190px; margin:0; text-align:center; }
    .month-grid { display:grid; grid-template-columns:repeat(7,minmax(90px,1fr)); overflow:auto; border-top:1px solid var(--line); border-left:1px solid var(--line); border-radius:14px; background:#fff; }
    .weekday { min-width:90px; padding:9px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); text-align:center; color:var(--muted); font-size:.72rem; font-weight:900; text-transform:uppercase; background:#f6f8fb; }
    .day-cell { min-width:90px; min-height:112px; padding:7px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); background:#fff; cursor:pointer; }
    .day-cell.outside { background:#f8fafc; color:#9aa5b4; }
    .day-cell.today { box-shadow:inset 0 0 0 3px #84aef0; }
    .day-number { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; font-size:.75rem; font-weight:900; }
    .cal-item { display:block; width:100%; margin:3px 0; padding:4px 6px; overflow:hidden; border:0; border-left:4px solid var(--event-color,var(--blue)); border-radius:6px; text-align:left; text-overflow:ellipsis; white-space:nowrap; color:#26354a; background:#edf3fb; font-size:.64rem; }
    .week-grid { display:grid; grid-template-columns:repeat(7,minmax(125px,1fr)); gap:8px; overflow:auto; }
    .week-day { min-width:125px; min-height:320px; padding:11px; border:1px solid var(--line); border-radius:14px; background:#fff; cursor:pointer; }
    .week-day.today { box-shadow:inset 0 0 0 2px #6b9be7; }
    .week-day h4 { margin:0 0 10px; }
    .day-agenda { display:grid; gap:10px; }
    .agenda-row { padding:12px; border-left:5px solid var(--event-color,var(--blue)); border-radius:11px; background:#f6f9fd; }
    .agenda-row strong { display:block; }
    .agenda-row small { color:var(--muted); }
    .filters { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
    .filter-btn { min-height:36px; padding:7px 12px; border:1px solid var(--line); border-radius:999px; background:#fff; color:#516078; font-size:.76rem; font-weight:850; }
    .filter-btn.active { border-color:var(--navy); color:#fff; background:var(--navy); }
    .assignment-list { display:grid; gap:11px; }
    .assignment-card { display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:12px; padding:15px; border:1px solid var(--line); border-left:6px solid var(--class-color,var(--blue)); border-radius:15px; background:#fff; box-shadow:0 4px 15px rgba(21,45,78,.05); }
    .assignment-card.done { opacity:.7; }
    .assignment-card.done .assignment-title { text-decoration:line-through; }
    .assignment-title { margin:0 0 5px; font-size:1rem; }
    .assignment-meta { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
    .assignment-notes { margin:9px 0 0; color:#59677a; font-size:.82rem; }
    .assignment-actions { display:flex; gap:5px; align-items:flex-start; }
    .step-list { display:grid; gap:6px; margin-top:10px; padding:10px; border-radius:10px; background:#f6f8fb; }
    .step-row { display:flex; gap:8px; align-items:center; font-size:.78rem; }
    .step-row.done span { text-decoration:line-through; color:var(--muted); }
    .progress-label { display:flex; justify-content:space-between; margin:10px 0 5px; color:var(--muted); font-size:.7rem; font-weight:800; }
    .attachment-list { display:flex; flex-wrap:wrap; gap:7px; margin-top:9px; }
    .attachment { padding:6px 9px; border-radius:8px; background:#edf3fb; font-size:.73rem; }
    .form-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
    .form-grid .full { grid-column:1/-1; }
    .modal-backdrop { position:fixed; inset:0; z-index:50; display:none; place-items:center; padding:20px; background:rgba(7,21,43,.68); }
    .modal-backdrop.open { display:grid; }
    .modal { width:min(760px,100%); max-height:92vh; overflow:auto; border-radius:20px; background:#fff; box-shadow:0 30px 80px rgba(0,0,0,.3); }
    .modal-head { position:sticky; top:0; z-index:2; display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--line); background:#fff; }
    .modal-head h2 { margin:0; font-size:1.2rem; }
    .modal-body { padding:20px; }
    .close-btn { width:38px; height:38px; border:0; border-radius:10px; background:#eef2f7; font-size:1.2rem; }
    .timer { display:grid; place-items:center; min-height:310px; text-align:center; background:radial-gradient(circle at center,#fff 0 52%,#e9f1fb 53% 57%,transparent 58%); }
    .timer-time { font-size:clamp(3rem,9vw,5.5rem); line-height:1; font-weight:900; letter-spacing:-.07em; color:var(--navy); }
    .timer-label { margin:10px 0 18px; color:var(--muted); }
    .timer-actions { display:flex; gap:8px; }
    .notes-area { min-height:210px; }
    .grade-table { width:100%; border-collapse:collapse; }
    .grade-table th, .grade-table td { padding:11px 9px; border-bottom:1px solid var(--line); text-align:left; }
    .grade-table th { color:var(--muted); font-size:.72rem; text-transform:uppercase; }
    .grade-score { font-size:1.15rem; font-weight:900; color:var(--navy); }
    .grade-hidden { padding:44px 20px; text-align:center; }
    .routine-section { margin-bottom:18px; }
    .routine-section h3 { margin-bottom:10px; }
    .routine-list { display:grid; gap:7px; }
    .routine-item { display:flex; align-items:center; gap:10px; padding:10px 11px; border-radius:11px; background:#f5f8fc; }
    .routine-item.done span { color:var(--muted); text-decoration:line-through; }
    .habit-table { display:grid; grid-template-columns:minmax(120px,1fr) repeat(7,38px); gap:6px; align-items:center; }
    .habit-day { text-align:center; color:var(--muted); font-size:.65rem; font-weight:800; }
    .habit-check { display:grid; place-items:center; width:36px; height:36px; border:1px solid var(--line); border-radius:10px; background:#fff; color:transparent; }
    .habit-check.done { border-color:#65bb98; background:#dff4ea; color:#08714a; }
    .settings-section { padding:18px; border:1px solid var(--line); border-radius:15px; background:#fff; }
    .settings-section h3 { margin:0 0 12px; }
    .toggle-row { display:flex; align-items:center; justify-content:space-between; gap:14px; padding:11px 0; border-bottom:1px solid #edf0f4; }
    .toggle-row:last-child { border-bottom:0; }
    .toggle-row strong { display:block; }
    .toggle-row small { color:var(--muted); }
    .switch { position:relative; width:48px; height:28px; flex:none; }
    .switch input { position:absolute; opacity:0; }
    .switch span { position:absolute; inset:0; border-radius:999px; background:#b9c4d2; transition:.2s; }
    .switch span:after { content:""; position:absolute; width:22px; height:22px; left:3px; top:3px; border-radius:50%; background:#fff; transition:.2s; box-shadow:0 2px 5px rgba(0,0,0,.2); }
    .switch input:checked + span { background:var(--blue); }
    .switch input:checked + span:after { transform:translateX(20px); }
    .schedule-editor { display:grid; gap:8px; }
    .editor-row { display:grid; grid-template-columns:52px 1.25fr 1.25fr .75fr .75fr 48px; gap:7px; align-items:end; padding:9px; border:1px solid var(--line); border-radius:12px; }
    .editor-row input { min-width:0; }
    .editor-row .period-num { align-self:center; text-align:center; font-weight:900; color:var(--navy); }
    .color-input { padding:3px; }
    .toast { position:fixed; z-index:80; right:22px; bottom:22px; max-width:360px; padding:13px 16px; border-radius:12px; color:#fff; background:#162b4b; box-shadow:0 14px 30px rgba(0,0,0,.22); opacity:0; transform:translateY(15px); pointer-events:none; transition:.2s; }
    .toast.show { opacity:1; transform:none; }
    .celebration { position:fixed; inset:0; z-index:90; display:none; place-items:center; padding:20px; background:rgba(12,31,61,.72); }
    .celebration.show { display:grid; }
    .celebration-box { max-width:430px; padding:32px; border-radius:24px; text-align:center; background:#fff; animation:pop .35s ease; }
    .celebration-box .emoji { font-size:4rem; }
    @keyframes pop { from { transform:scale(.75); opacity:0; } }
    .privacy-note { padding:11px 13px; border-radius:11px; color:#44556d; background:#eef4fb; font-size:.76rem; }
    .mobile-only { display:none; }
    body.dark { --ink:#eef4ff; --muted:#a8b4c7; --line:#34435a; --card:#172337; --bg:#0e1828; --soft:#172337; --shadow:0 10px 30px rgba(0,0,0,.18); }
    body.dark .nav, body.dark input, body.dark select, body.dark textarea, body.dark .btn.secondary, body.dark .month-grid, body.dark .day-cell, body.dark .week-day, body.dark .assignment-card, body.dark .settings-section, body.dark .modal, body.dark .modal-head, body.dark .priority-item { background:#172337; color:var(--ink); }
    body.dark .schedule-row, body.dark .stat, body.dark .empty, body.dark .step-list, body.dark .routine-item, body.dark .agenda-row { background:#202e43; }
    body.dark .weekday, body.dark .day-cell.outside { background:#111d2f; }
    body.dark .filter-btn { background:#172337; color:#d7e1ef; }
    body.dark .cal-item { color:#e6eef9; background:#263750; }
    body.high-contrast { --ink:#000; --muted:#202020; --line:#111; --bg:#fff; --card:#fff; --navy:#002c6d; --blue:#004fd1; }
    body.high-contrast .card, body.high-contrast input, body.high-contrast select, body.high-contrast textarea { border-width:2px; }
    body.large-text { --text-size:19px; }
    body.dyslexia { font-family:Verdana, Tahoma, Arial, sans-serif; letter-spacing:.02em; word-spacing:.08em; }
    body.reduced .school-chip, body.reduced .motivation-only, body.reduced .eyebrow { display:none !important; }
    body.study-mode .topbar, body.study-mode .nav, body.study-mode .page:not(#study) { display:none !important; }
    body.study-mode .layout { display:block; max-width:900px; }
    body.study-mode main { margin:auto; }
    @media (max-width:1050px) {
      .dashboard, .grid.three { grid-template-columns:1fr; }
      .quick-add { grid-template-columns:1fr 1fr 1fr; }
      .quick-add .qa-title { grid-column:1/-1; }
      .quick-add .qa-button { grid-column:3; }
      .editor-row { grid-template-columns:45px 1fr 1fr; }
    }
    @media (max-width:780px) {
      .topbar { min-height:70px; padding:10px 14px; }
      .brand-mark { width:43px; height:43px; }
      .top-actions .hide-mobile { display:none; }
      .layout { display:block; }
      .nav { position:sticky; top:70px; z-index:18; display:flex; gap:4px; width:100%; height:auto; padding:7px; overflow-x:auto; border-right:0; border-bottom:1px solid var(--line); }
      .nav button { width:auto; flex:none; margin:0; padding:8px 10px; font-size:.72rem; }
      .nav .nav-icon { width:auto; }
      .school-chip { display:none; }
      main { padding:16px 12px 90px; }
      .grid.two, .form-grid { grid-template-columns:1fr; }
      .form-grid .full { grid-column:auto; }
      .hero-grid { grid-template-columns:1fr; }
      .date-badge { display:none; }
      .quick-add { grid-template-columns:1fr 1fr; }
      .quick-add .qa-title { grid-column:1/-1; }
      .quick-add .qa-button { grid-column:auto; }
      .assignment-card { grid-template-columns:auto minmax(0,1fr); }
      .assignment-actions { grid-column:2; }
      .stats { grid-template-columns:repeat(3,1fr); }
      .page-head { align-items:flex-start; }
      .page-head .btn { flex:none; }
      .mobile-only { display:block; }
      .habit-table { grid-template-columns:minmax(100px,1fr) repeat(7,32px); gap:4px; overflow:auto; }
      .habit-check { width:30px; height:30px; }
    }
    @media print {
      .topbar, .nav, button, .quick-add, .no-print { display:none !important; }
      .layout { display:block; }
      main { padding:0; }
      .page { display:none !important; }
      .page.active { display:block !important; }
      .card { box-shadow:none; break-inside:avoid; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand-mark" id="brandMark" aria-hidden="true">L</div>
      <div class="brand">
        <h1>Lyric's School Planner</h1>
        <p>Clark High School · 10th Grade · 2026–27</p>
      </div>
      <div class="top-actions">
        <button class="icon-btn hide-mobile" id="headerQuickAdd">＋ Quick add</button>
        <button class="icon-btn" id="themeButton" aria-label="Toggle dark mode">☾</button>
      </div>
    </header>
    <div class="layout">
      <nav class="nav" aria-label="Planner sections">

      {id:'worldhistory',period:3,name:'World History',bName:'World History',room:'A211',teacher:'White, Karla',start:'10:55',end:'11:45',earlyStart:'10:00',earlyEnd:'10:25',color:'#8c4bc0',weights:{homework:20,quiz:20,test:35,project:25},goal:90},

    function clone(v){ return JSON.parse(JSON.stringify(v)); }
    function loadState(){

        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));

          ...clone(defaultState), ...saved,
          profile:{...defaultState.profile,...saved.profile}, school:{...defaultState.school,...saved.school},

          studySessions:saved.studySessions||[], routineLog:saved.routineLog||{}, habitLog:saved.habitLog||{}, weeklyReviews:saved.weeklyReviews||{}, notified:saved.notified||{}
        };
        return merged;
      } catch(e){ return clone(defaultState); }
    }
    function saveState(){ localStorage.setItem(STORAGE_KEY,JSON.stringify(state)); }
    function uid(prefix='id'){ return prefix+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7); }
    function esc(value=''){ return String(value).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
    function parseDate(iso){ const [y,m,d]=String(iso).split('-').map(Number); return new Date(y,m-1,d); }
    function toISO(d){ const x=new Date(d); return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`; }
    function localISO(){ return toISO(new Date()); }
    function addDays(iso,n){ const d=parseDate(iso); d.setDate(d.getDate()+n); return toISO(d); }
    function dayDiff(a,b){ return Math.round((parseDate(b)-parseDate(a))/86400000); }
    function fmt(iso,opts={month:'short',day:'numeric'}){ if(!iso)return ''; return parseDate(iso).toLocaleDateString(undefined,opts); }
    function fmtLong(iso){ return fmt(iso,{weekday:'long',month:'long',day:'numeric',year:'numeric'}); }
    function classById(id){ return state.classes.find(c=>c.id===id)||{name:'General',color:'#667085',room:'',teacher:''}; }
    function priorityRank(p){ return ({high:0,medium:1,low:2})[p]??1; }
    function isPast(iso){ return iso && iso < localISO(); }
    function eventOccurs(e,iso){
      if(!e.date || iso<e.date) return false;
      if(e.recurrence==='daily') return true;
      if(e.recurrence==='weekly') return parseDate(e.date).getDay()===parseDate(iso).getDay();
      if(e.recurrence==='monthly') return parseDate(e.date).getDate()===parseDate(iso).getDate();
      return e.date===iso;
    }
    function eventsOn(iso){ return state.events.filter(e=>eventOccurs(e,iso)).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99')); }
    function isSchoolDay(iso){
      const d=parseDate(iso), day=d.getDay();
      return iso>=state.school.start && iso<=state.school.end && day!==0 && day!==6 && !eventsOn(iso).some(e=>e.type==='no-school');
    }
    function nextSchoolDay(iso){ let x=iso; for(let i=0;i<370;i++){ x=addDays(x,1); if(isSchoolDay(x)) return x; } return addDays(iso,1); }
    function dayType(iso){
      if(state.school.rotationMode!=='ab') return 'Standard day';
      let count=0, d=state.school.start;
      while(d<iso && count<300){ if(isSchoolDay(d)) count++; d=addDays(d,1); }
      return count%2===0?'A Day':'B Day';
    }
    function displayClass(c,iso){ return state.school.rotationMode==='ab'&&dayType(iso)==='B Day'?(c.bName||c.name):c.name; }
    function humanTime(t){ if(!t)return ''; const [h,m]=t.split(':').map(Number); return new Date(2000,0,1,h,m).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}); }
    function assignmentStatus(a){ if(a.completed)return 'completed'; if(a.dueDate<localISO())return 'overdue'; return 'incomplete'; }
    function sortedAssignments(list=state.assignments){
      return [...list].sort((a,b)=> Number(a.completed)-Number(b.completed) || (a.dueDate||'9999').localeCompare(b.dueDate||'9999') || priorityRank(a.priority)-priorityRank(b.priority) || Number(a.estimate||0)-Number(b.estimate||0));
    }
    function homeworkScore(a){
      const days=Math.max(-5,dayDiff(localISO(),a.dueDate||localISO()));
      return (a.dueDate<localISO()?1000:0)+(a.priority==='high'?240:a.priority==='medium'?120:30)+Math.max(0,10-days)*25-(Number(a.estimate)||0)*.12;
    }
    function autoRoll(){
      const today=localISO(); let changed=false;
      state.assignments.forEach(a=>{
        if(!a.completed && a.plannedDate && a.plannedDate<today && a.lastRolled!==today){
          a.plannedDate=today; a.postponed=(a.postponed||0)+1; a.lastRolled=today; changed=true;
        }
      });
      if(changed) saveState();
    }
    function applySettings(){
      const themes={navy:['#163b72','#0d2b58','#2f6fed'],forest:['#176147','#0c4331','#23936e'],purple:['#60358f','#39205f','#8157ba']};
      const colors=themes[state.settings.theme]||themes.navy;
      document.documentElement.style.setProperty('--navy',colors[0]);
      document.documentElement.style.setProperty('--navy-2',colors[1]);
      document.documentElement.style.setProperty('--blue',colors[2]);
      document.body.classList.toggle('dark',!!state.settings.dark);
      document.body.classList.toggle('large-text',!!state.settings.largeText);
      document.body.classList.toggle('high-contrast',!!state.settings.highContrast);
      document.body.classList.toggle('dyslexia',!!state.settings.dyslexia);
      document.body.classList.toggle('reduced',!!state.settings.reduced);
      document.getElementById('themeButton').textContent=state.settings.dark?'☀':'☾';
      document.getElementById('brandMark').textContent=state.settings.profileIcon||'L';
    }
    function toast(message){
      const el=document.getElementById('toast'); el.textContent=message; el.classList.add('show');
      clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),2500);
    }
    function classOptions(selected=''){
      return state.classes.filter(c=>!c.isLunch).map(c=>`<option value="${esc(c.id)}" ${c.id===selected?'selected':''}>Period ${c.period} · ${esc(c.name)}</option>`).join('');
    }
    function empty(title,text){ return `<div class="empty"><strong>${esc(title)}</strong>${esc(text)}</div>`; }
    function statusPill(a){
      if(a.completed)return '<span class="pill green">Complete</span>';
      if(a.dueDate<localISO())return '<span class="pill red">Overdue</span>';
      if(a.dueDate===localISO())return '<span class="pill gold">Due today</span>';
      return `<span class="pill blue">Due ${esc(fmt(a.dueDate))}</span>`;
    }
    function compactAssignment(a,index=null){
      const c=classById(a.classId);
      return `<div class="priority-item" style="--class-color:${esc(c.color)}">
        ${index!==null?`<span class="priority-number">${index+1}</span>`:`<input class="check" type="checkbox" data-complete="${esc(a.id)}" ${a.completed?'checked':''} aria-label="Mark ${esc(a.title)} complete">`}
        <div class="item-main"><strong>${esc(a.title)}</strong><small>${esc(c.name)} · ${a.estimate||20} min · due ${esc(fmt(a.dueDate))}${(a.postponed||0)>=2?` · postponed ${a.postponed}×`:''}</small></div>
        ${statusPill(a)}
      </div>`;
    }
    function scheduleRows(iso,limit=false,mode='normal'){
      if(!isSchoolDay(iso)) return empty(iso<state.school.start?'School has not started yet':iso>state.school.end?'School year complete':'No regular classes','The normal class schedule appears on school days.');
      const now=new Date(), isToday=iso===localISO(), hm=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
      const rows=state.classes.map(c=>{const start=mode==='early'?(c.earlyStart||c.start):c.start,end=mode==='early'?(c.earlyEnd||c.end):c.end;return `<div class="schedule-row ${mode==='normal'&&isToday&&hm>=start&&hm<=end?'current':''}" style="--class-color:${esc(c.color)}">
        <span class="time">${humanTime(start)}<br>${humanTime(end)}</span><span class="dot"></span>
        <span><strong>${esc(displayClass(c,iso))}</strong><small>Period ${c.period} · ${esc(c.teacher)} · ${esc(c.room)}</small></span><span class="pill">${c.isLunch?'Lunch':'P'+c.period}</span>
      </div>`;}).join('');
      return rows;
    }
    function getStreak(){
      const days=new Set(state.assignments.filter(a=>a.completed&&a.completedDate).map(a=>a.completedDate)); let streak=0, d=localISO();
      while(days.has(d)){ streak++; d=addDays(d,-1); } return streak;
    }
    function renderToday(){
      const today=localISO(), quickDue=today<state.school.start?state.school.start:today, incomplete=state.assignments.filter(a=>!a.completed);
      const priorities=[...incomplete].sort((a,b)=>homeworkScore(b)-homeworkScore(a)).slice(0,3);
      const dueToday=incomplete.filter(a=>a.dueDate===today), overdue=incomplete.filter(a=>a.dueDate<today);
      const upcoming=incomplete.filter(a=>['test','quiz','project','presentation'].includes(a.type)&&a.dueDate>today&&dayDiff(today,a.dueDate)<=14);
      const activities=eventsOn(today).filter(e=>!['school','no-school'].includes(e.type));
      const homework=[...incomplete].filter(a=>(a.plannedDate||a.startDate||a.dueDate)<=today||dayDiff(today,a.dueDate)<=7).sort((a,b)=>homeworkScore(b)-homeworkScore(a));
      const minutes=homework.filter(a=>(a.plannedDate||a.dueDate)<=today).reduce((n,a)=>n+(Number(a.estimate)||20),0);
      const loadPct=Math.min(100,Math.round(minutes/150*100));
      const schoolStatus=today<state.school.start?`School begins in ${dayDiff(today,state.school.start)} days`:today>state.school.end?'The 2026–27 school year is complete':isSchoolDay(today)?`${dayType(today)} · First bell 9:00 AM`:'No regular classes today';
      document.getElementById('today').innerHTML=`
        <div class="grid dashboard">
          <div class="stack">
            <div class="card hero"><div class="hero-grid"><div><p class="eyebrow">${esc(fmtLong(today))}</p><h2>${today<state.school.start?'Ready for 10th grade, Lyric?':'Here is your plan, Lyric.'}</h2><p>${esc(schoolStatus)}. Your top work and schedule are organized below.</p></div><div class="date-badge"><span class="small">${esc(fmt(today,{month:'long'}))}</span><span class="big">${parseDate(today).getDate()}</span><span class="small">${esc(fmt(today,{weekday:'long'}))}</span></div></div></div>
            <div class="card card-pad">
              <div class="card-title"><div><h3>Quick assignment</h3><p>Title, class, due date, and time—done in seconds.</p></div><span class="pill blue">Under 20 sec</span></div>
              <form class="quick-add" id="quickAddForm">
                <input class="qa-title" name="title" required maxlength="100" placeholder="What needs to be done?" aria-label="Assignment title">

                <input type="date" name="dueDate" value="${quickDue}" min="${state.school.start}" aria-label="Due date" required>
                <select name="estimate" aria-label="Estimated minutes"><option value="15">15 min</option><option value="30" selected>30 min</option><option value="45">45 min</option><option value="60">60 min</option><option value="90">90 min</option></select>
                <button class="btn qa-button">Add</button>
              </form>
            </div>
            <div class="card card-pad">
              <div class="card-title"><div><h3>Top three priorities</h3><p>Sorted by urgency, priority, and time.</p></div><button class="btn small secondary" data-open-assignment>Add details</button></div>
              <div class="priority-list">${priorities.length?priorities.map((a,i)=>compactAssignment(a,i)).join(''):empty('Nothing urgent yet','Add an assignment and it will appear here automatically.')}</div>
            </div>
            <div class="grid two">
              <div class="card card-pad"><div class="card-title"><div><h3>Due today</h3><p>${dueToday.length} assignment${dueToday.length===1?'':'s'}</p></div></div><div class="compact-list">${dueToday.length?dueToday.map(a=>compactAssignment(a)).join(''):empty('All clear','No assignments are due today.')}</div></div>
              <div class="card card-pad"><div class="card-title"><div><h3>Overdue</h3><p>Finish or reschedule these first.</p></div>${overdue.length?`<span class="pill red">${overdue.length}</span>`:''}</div><div class="compact-list">${overdue.length?overdue.map(a=>compactAssignment(a)).join(''):empty('No overdue work','Nice job keeping up.')}</div></div>
            </div>
            <div class="card card-pad">
              <div class="card-title"><div><h3>Suggested homework order</h3><p>Shortest urgent work rises to the top.</p></div><button class="btn small soft" data-page-jump="study">Start focus timer</button></div>
              <div class="priority-list">${homework.length?homework.slice(0,6).map((a,i)=>compactAssignment(a,i)).join(''):empty('No homework queued','New work will be arranged here automatically.')}</div>
            </div>
          </div>
          <aside class="stack">
            <div class="card card-pad"><div class="card-title"><div><h3>Today's schedule</h3><p>${esc(dayType(today))}</p></div><button class="btn small secondary" data-page-jump="schedule">Full schedule</button></div><div class="schedule-list">${scheduleRows(today,true)}</div></div>
            <div class="card card-pad"><div class="card-title"><div><h3>Evening workload</h3><p>${minutes} planned minutes</p></div><span class="pill ${minutes>150?'red':minutes>90?'gold':'green'}">${minutes>150?'Too heavy':minutes>90?'Busy':'Balanced'}</span></div><div class="workload"><div class="meter-track"><div class="meter-fill" style="width:${loadPct}%"></div></div><small>${minutes>150?'Move a lower-priority task or ask for help before the evening gets overloaded.':minutes>90?'Plan a break between study blocks.':'This looks manageable.'}</small></div></div>
            <div class="card card-pad"><div class="card-title"><div><h3>Tests & major work</h3><p>Next 14 days</p></div></div><div class="compact-list">${upcoming.length?upcoming.map(a=>compactAssignment(a)).join(''):empty('Nothing coming up','Tests and projects will appear here.')}</div></div>
            <div class="card card-pad"><div class="card-title"><div><h3>After school</h3><p>Activities, chores, and appointments</p></div><button class="btn small secondary" data-open-event>Add</button></div><div class="day-agenda">${activities.length?activities.map(eventCard).join(''):empty('No activities today','Add sports, clubs, tutoring, chores, or family events.')}</div></div>
            ${state.settings.motivation?`<div class="card card-pad motivation-only"><div class="card-title"><div><h3>Progress</h3><p>Optional motivation</p></div></div><div class="stats"><div class="stat"><strong>${state.assignments.filter(a=>a.completed).length}</strong><span>Completed</span></div><div class="stat"><strong>${getStreak()}</strong><span>Day streak</span></div><div class="stat"><strong>${state.assignments.filter(a=>a.type==='project'&&a.completed).length}</strong><span>Projects</span></div></div><p style="margin:12px 0 0;color:var(--muted);font-size:.8rem">${priorities.length?'One focused block at a time. You have a clear plan.':'A calm plan is a strong start.'}</p></div>`:''}
          </aside>
        </div>`;
    }
    function eventColor(type){ return ({activity:'#2f6fed',appointment:'#8c4bc0',family:'#cf3b67',chore:'#b76b00',club:'#16865c',tutoring:'#008a9a','no-school':'#c23434',school:'#163b72',study:'#7d51bd'})[type]||'#667085'; }
    function eventCard(e){ return `<div class="agenda-row" style="--event-color:${eventColor(e.type)}"><strong>${esc(e.title)}</strong><small>${e.time?humanTime(e.time)+' · ':''}${esc(e.type.replace('-',' '))}${e.recurrence!=='none'?` · repeats ${esc(e.recurrence)}`:''}</small>${e.notes?`<div class="assignment-notes">${esc(e.notes)}</div>`:''}</div>`; }
    function itemsForDate(iso){
      const events=eventsOn(iso).map(e=>({kind:'event',title:e.title,color:eventColor(e.type),time:e.time||'',data:e}));
      const assignments=state.assignments.filter(a=>a.dueDate===iso).map(a=>({kind:'assignment',title:a.title,color:classById(a.classId).color,time:'',data:a}));
      return [...events,...assignments].sort((a,b)=>a.time.localeCompare(b.time));
    }
    function renderCalendar(){
      const label=calendarView==='month'?calendarCursor.toLocaleDateString(undefined,{month:'long',year:'numeric'}):calendarView==='week'?`Week of ${fmt(toISO(startOfWeek(calendarCursor)),{month:'short',day:'numeric'})}`:fmtLong(toISO(calendarCursor));
      let content='';
      if(calendarView==='month'){
        const first=new Date(calendarCursor.getFullYear(),calendarCursor.getMonth(),1), start=startOfWeek(first), cells=[];
        for(let i=0;i<42;i++){
          const d=new Date(start); d.setDate(start.getDate()+i); const iso=toISO(d), outside=d.getMonth()!==calendarCursor.getMonth(); const items=itemsForDate(iso);

    function classAverage(c,grades=state.grades){

      const tr=document.getElementById('timerToggle'); if(tr)tr.onclick=toggleTimer;

      document.querySelectorAll('[data-timer-min]').forEach(b=>b.onclick=()=>setTimer(Number(b.dataset.timerMin),b.dataset.timerMode));
      const sm=document.getElementById('studyModeButton'); if(sm)sm.onclick=()=>{document.body.classList.toggle('study-mode');sm.textContent=document.body.classList.contains('study-mode')?'Exit study mode':'Distraction-free mode';};

      document.querySelectorAll('[data-habit]').forEach(x=>x.onclick=()=>{const k=`${x.dataset.habitDate}|${x.dataset.habit}`;state.habitLog[k]=!state.habitLog[k];saveState();renderRoutines();bindDynamic();});
      const sr=document.getElementById('saveReview'); if(sr)sr.onclick=()=>{state.weeklyReviews[weekKey()]=document.getElementById('weeklyReview').value;saveState();toast('Weekly review saved.');};

      const rd=document.getElementById('defaultReminderDays'); if(rd)rd.onchange=()=>{state.settings.defaultReminderDays=Number(rd.value);saveState();};

    function moveCalendar(dir){
      if(calendarView==='month')calendarCursor=new Date(calendarCursor.getFullYear(),calendarCursor.getMonth()+dir,1);
      else calendarCursor=parseDate(addDays(toISO(calendarCursor),dir*(calendarView==='week'?7:1)));
      renderCalendar();bindDynamic();
    }

    function openAssignmentModal(id=null){

r="Choose topic | 2026-09-10&#10;Create outline | 2026-09-12&#10;Finish final draft | 2026-09-18">${esc(steps)}</textarea></label><label class="full">Attach small photos or documents (under 600 KB each)<input type="file" name="files" multiple></label><div class="privacy-note full">Attachments stay only in this browser. Large files should be saved in Google Drive and added as a website link.</div><button class="btn full">${a?'Save changes':'Add assignment'}</button></form>`);

    async function saveAssignment(e){
      e.preventDefault(); const f=new FormData(e.currentTarget), id=f.get('id'), existing=id?state.assignments.find(x=>x.id===id):null;
      const oldSteps=existing?.steps||[];
      const steps=String(f.get('steps')||'').split('\n').map(x=>x.trim()).filter(Boolean).map((line,i)=>{const [title,due]=line.split('|').map(x=>x.trim()); return {title,due:/^\d{4}-\d{2}-\d{2}$/.test(due||'')?due:'',done:oldSteps[i]?.title===title?oldSteps[i].done:false};});
      const attachments=[...(existing?.attachments||[])], files=e.currentTarget.elements.files.files;
      for(const file of files){ if(file.size>600000){toast(`${file.name} is too large; use a link instead.`);continue;} attachments.push({name:file.name,data:await fileData(file)}); }
      const obj={id:id||uid('a'),title:String(f.get('title')).trim(),classId:f.get('classId'),type:f.get('type'),startDate:f.get('startDate'),dueDate:f.get('dueDate'),plannedDate:f.get('plannedDate')||f.get('startDate'),priority:f.get('priority'),estimate:Number(f.get('estimate'))||30,reminderDays:Number(f.get('reminderDays')),notes:f.get('notes'),url:f.get('url'),steps,attachments,completed:existing?.completed||false,completedDate:existing?.completedDate||'',postponed:existing?.postponed||0,lastRolled:existing?.lastRolled||'',prepChecklist:existing?.prepChecklist};
      if(existing)Object.assign(existing,obj); else state.assignments.push(obj); saveState();closeModal();renderAll();showPage(activePage);toast(existing?'Assignment updated.':'Assignment added.');
    }
    function fileData(file){ return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file);}); }
    function toggleComplete(id,checked){ const a=state.assignments.find(x=>x.id===id);if(!a)return;a.completed=checked;a.completedDate=checked?localISO():'';saveState();if(checked&&a.type==='project'&&state.settings.motivation)document.getElementById('celebration').classList.add('show');renderAll();showPage(activePage); }
    function toggleStep(id,index,checked){ const a=state.assignments.find(x=>x.id===id);if(!a?.steps?.[index])return;a.steps[index].done=checked;if(a.steps.length&&a.steps.every(s=>s.done)){a.completed=true;a.completedDate=localISO();if(a.type==='project'&&state.settings.motivation)document.getElementById('celebration').classList.add('show');}saveState();renderAll();showPage(activePage); }
    function togglePrep(id,index,checked){ const a=state.assignments.find(x=>x.id===id);if(!a)return;if(!a.prepChecklist)a.prepChecklist=['Review notes','Make or review a study guide','Practice without notes','Pack needed materials'].map(title=>({title,done:false}));a.prepChecklist[index].done=checked;saveState();renderStudy();bindDynamic(); }

    function addStudyLink(e){e.preventDefault();const f=new FormData(e.currentTarget);state.studyLinks.push({id:uid('l'),label:f.get('label'),url:f.get('url'),classId:f.get('classId')});saveState();renderStudy();bindDynamic();toast('Study link saved.');}
    function addGrade(e){e.preventDefault();const f=new FormData(e.currentTarget);state.grades.push({id:uid('g'),classId:f.get('classId'),name:f.get('name'),category:f.get('category'),score:Number(f.get('score')),max:Number(f.get('max')),date:f.get('date')});saveState();renderGrades();bindDynamic();toast('Grade saved.');}
    function saveGradeSettings(e){e.preventDefault();const f=new FormData(e.currentTarget);for(const c of state.classes.filter(x=>!x.isLunch)){c.goal=Number(f.get(`goal-${c.id}`));if(c.gradingPolicy?.type==='formative-summative')continue;const weights={homework:Number(f.get(`homework-${c.id}`)),quiz:Number(f.get(`quiz-${c.id}`)),test:Number(f.get(`test-${c.id}`)),project:Number(f.get(`project-${c.id}`))},total=Object.values(weights).reduce((n,x)=>n+x,0);if(total!==100){toast(`${c.name} weights total ${total}%. Please make them total 100%.`);return;}c.weights=weights;}saveState();renderGrades();bindDynamic();toast('Grade goals and weights saved.');}
    function calculateWhatIf(e){e.preventDefault();const f=new FormData(e.currentTarget),classId=f.get('classId'),cat=f.get('category'),pct=Number(f.get('percent')),c=classById(classId),simulated=[...state.grades,{classId,category:cat,score:pct,max:100}],avg=classAverage(c,simulated);document.getElementById('whatIfResult').innerHTML=`A ${pct.toFixed(1)}% <strong>${esc(gradeCategoryLabel(cat))}</strong> would make the estimated weighted class average <strong>${avg===null?'—':avg.toFixed(1)+'%'}</strong>. This estimate treats the new item as 100 points${gradePolicyText(c)?` and uses ${esc(gradePolicyText(c))}`:''}.`;}
    function saveSchedule(e){e.preventDefault();const f=new FormData(e.currentTarget);state.classes.forEach(c=>{c.name=f.get(`name-${c.id}`);c.bName=f.get(`bName-${c.id}`)||c.name;c.room=f.get(`room-${c.id}`);c.teacher=f.get(`teacher-${c.id}`);c.color=f.get(`color-${c.id}`);});saveState();renderAll();showPage('settings');toast('Class schedule saved.');}
    async function requestNotifications(){ if(!('Notification'in window)){toast('This browser does not support notifications.');return;}const p=await Notification.requestPermission();toast(p==='granted'?'Notifications enabled.':'Notifications were not enabled.');if(p==='granted')checkNotifications(); }
    function checkNotifications(){
      if(!('Notification'in window)||Notification.permission!=='granted')return;const today=localISO(),now=new Date(),[h,m]=state.settings.reminderTime.split(':').map(Number);if(now.getHours()*60+now.getMinutes()<h*60+m)return;
      state.assignments.filter(a=>!a.completed).forEach(a=>{const days=dayDiff(today,a.dueDate),limit=a.reminderDays??state.settings.defaultReminderDays,key=`${today}|${a.id}`;if(days<=limit&&!state.notified[key]){new Notification(a.dueDate<today?'Overdue assignment':`${a.type||'Assignment'} reminder`,{body:`${a.title} · ${classById(a.classId).name} · ${a.dueDate<today?'overdue':'due '+fmt(a.dueDate)}`});state.notified[key]=true;saveState();}});
    }
    function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`lyric-planner-backup-${localISO()}.json`;a.click();URL.revokeObjectURL(url);toast('Backup downloaded.');}
    function importData(file){const r=new FileReader();r.onload=()=>{try{const data=JSON.parse(r.result);if(!Array.isArray(data.classes)||!Array.isArray(data.assignments))throw new Error();state=data;saveState();applySettings();renderAll();showPage('today');toast('Planner backup restored.');}catch(e){toast('That file is not a valid Lyric planner backup.');}};r.readAsText(file);}
    document.querySelectorAll('.nav button[data-page]').forEach(b=>b.onclick=()=>showPage(b.dataset.page));
    document.getElementById('headerQuickAdd').onclick=()=>openAssignmentModal();
    document.getElementById('themeButton').onclick=()=>{state.settings.dark=!state.settings.dark;saveState();applySettings();};
    document.getElementById('modalClose').onclick=closeModal;
    document.getElementById('modalBackdrop').onclick=e=>{if(e.target.id==='modalBackdrop')closeModal();};
    document.getElementById('closeCelebration').onclick=()=>document.getElementById('celebration').classList.remove('show');
    document.getElementById('importInput').onchange=e=>{if(e.target.files[0])importData(e.target.files[0]);};
    document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();document.body.classList.remove('study-mode');}});
    autoRoll();applySettings();renderAll();checkNotifications();setInterval(checkNotifications,60000);
  })();
  </script>
</body>
</html>
